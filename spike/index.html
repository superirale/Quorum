<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quorum spike</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: #14151a; color: #e6e6ea;
      }
      header {
        padding: 12px 20px; border-bottom: 1px solid #2a2c35;
        display: flex; align-items: center; gap: 12px;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      .status {
        font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
        padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor;
      }
      .status.open    { color: #8b8f9e; }
      .status.working { color: #56a8f5; }
      .status.blocked { color: #f5a623; }
      .status.done    { color: #4ec98a; }
      #stream { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
      .row { display: flex; gap: 10px; align-items: baseline; }
      .who { font-weight: 600; min-width: 96px; }
      .who.agent { color: #a78bfa; }
      .who.human { color: #7dd3fc; }
      .who.system { color: #6b7280; }
      .seq { color: #4a4d59; font-size: 11px; font-variant-numeric: tabular-nums; min-width: 24px; }
      .card { border: 1px solid #2a2c35; border-radius: 8px; padding: 12px 14px; background: #191b22; max-width: 640px; }
      .card.approval { border-color: #f5a623; background: #221c10; }
      .card.resolved { border-color: #2a2c35; background: #191b22; opacity: .75; }
      .card h3 { margin: 0 0 4px; font-size: 13px; }
      .card p { margin: 0 0 10px; color: #b4b7c2; }
      .risk { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #f5a623; }
      .action { font-family: ui-monospace, monospace; font-size: 12.5px; color: #9ca3af; }
      .action .st { text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: #2a2c35; color: #c9ccd6; }
      .action .st.succeeded { background: #14361f; color: #4ec98a; }
      .action .st.denied, .action .st.failed { background: #3a1a1a; color: #f87171; }
      .action .st.running { background: #10283f; color: #56a8f5; }
      button {
        font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 6px;
        border: 1px solid #3a3d49; background: #232631; color: #e6e6ea; cursor: pointer;
      }
      button.primary { background: #2563eb; border-color: #2563eb; }
      button.danger  { background: #3a1a1a; border-color: #7f2b2b; color: #f87171; }
      button:disabled { opacity: .4; cursor: default; }
      footer { padding: 14px 20px; border-top: 1px solid #2a2c35; display: flex; gap: 8px; }
      input {
        flex: 1; font: inherit; padding: 9px 12px; border-radius: 6px;
        border: 1px solid #2a2c35; background: #191b22; color: inherit;
      }
      .hint { color: #6b7280; font-size: 12px; padding: 0 20px 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">…</h1>
      <span class="status open" id="threadStatus">open</span>
    </header>
    <div id="stream"></div>
    <div class="hint">You are <strong>Ada</strong>. Mention <code>@deploy</code> to address the agent.</div>
    <footer>
      <input id="input" placeholder="@deploy ship the payments hotfix" autofocus />
      <button class="primary" id="send">Send</button>
    </footer>

    <script type="module">
      const ME = { id: 'usr_ada', kind: 'human', display_name: 'Ada' }
      const $stream = document.getElementById('stream')
      const $input = document.getElementById('input')
      const $status = document.getElementById('threadStatus')
      const $title = document.getElementById('title')

      let thread = null
      const seen = new Set()
      const resolved = new Set() // approval_ids that already have a response

      const post = (body) =>
        fetch('/events', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        })

      function el(tag, cls, text) {
        const n = document.createElement(tag)
        if (cls) n.className = cls
        if (text != null) n.textContent = text
        return n
      }

      function render(evt) {
        if (seen.has(evt.id)) return
        seen.add(evt.id)

        const row = el('div', 'row')
        row.dataset.eventId = evt.id
        row.append(el('span', 'seq', evt.seq))
        row.append(el('span', `who ${evt.actor.kind}`, evt.actor.display_name ?? evt.actor.id))

        if (evt.type === 'message') {
          row.append(el('span', null, evt.body.text))
        } else if (evt.type === 'action') {
          const card = el('span', 'action')
          card.append(el('span', `st ${evt.body.status}`, evt.body.status))
          card.append(
            el('span', null, ` ${evt.body.name} — ${evt.body.output_summary ?? evt.body.input_summary}`),
          )
          row.append(card)
        } else if (evt.type === 'approval_request') {
          const card = el('div', 'card approval')
          card.dataset.approvalId = evt.body.approval_id
          card.append(el('div', 'risk', `${evt.body.risk} risk · approval required`))
          card.append(el('h3', null, evt.body.title))
          card.append(el('p', null, evt.body.summary))
          if (evt.body.requested_grant) {
            card.append(
              el(
                'p',
                'action',
                `grants ${evt.body.requested_grant.resource} for ${evt.body.requested_grant.ttl_seconds}s`,
              ),
            )
          }
          const approve = el('button', 'primary', 'Approve')
          const deny = el('button', 'danger', 'Deny')
          approve.onclick = () => respond(evt, 'approved')
          deny.onclick = () => respond(evt, 'denied')
          const bar = el('div')
          bar.style.display = 'flex'
          bar.style.gap = '8px'
          bar.append(approve, deny)
          card.append(bar)
          row.append(card)
          if (resolved.has(evt.body.approval_id)) settle(evt.body.approval_id)
        } else if (evt.type === 'approval_response') {
          resolved.add(evt.body.approval_id)
          settle(evt.body.approval_id)
          row.append(
            el('span', null, `${evt.body.decision === 'approved' ? '✓ approved' : '✕ denied'} the request`),
          )
        } else {
          // Unknown type: render fallback_text. This is the forward-compat contract.
          row.append(el('span', null, evt.fallback_text))
        }

        $stream.append(row)
        $stream.scrollTop = $stream.scrollHeight
      }

      function settle(approvalId) {
        const card = $stream.querySelector(`[data-approval-id="${approvalId}"]`)
        if (!card) return
        card.classList.add('resolved')
        card.classList.remove('approval')
        card.querySelectorAll('button').forEach((b) => (b.disabled = true))
      }

      function respond(requestEvt, decision) {
        settle(requestEvt.body.approval_id)
        post({
          thread_id: requestEvt.thread_id,
          actor: ME,
          type: 'approval_response',
          body: {
            approval_id: requestEvt.body.approval_id,
            decision,
            decided_by: ME,
            reason: decision === 'denied' ? 'Not during the freeze window.' : undefined,
            grant_id: decision === 'approved' ? 'grant_spike' : undefined,
          },
          fallback_text: `Approval ${decision}: ${requestEvt.body.title}`,
          causation_id: requestEvt.id,
        })
      }

      function applyThread(t) {
        if (thread && t.id !== thread.id) return
        thread = t
        $title.textContent = t.title
        $status.textContent = t.status
        $status.className = `status ${t.status}`
      }

      const ws = new WebSocket(`ws://${location.host}`)
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data)
        if (msg.kind === 'hello') {
          applyThread(msg.threads[0])
          msg.events.forEach(render)
        }
        if (msg.kind === 'event') render(msg.event)
        if (msg.kind === 'thread') applyThread(msg.thread)
      }

      function send() {
        const text = $input.value.trim()
        if (!text || !thread) return
        $input.value = ''
        post({
          thread_id: thread.id,
          actor: ME,
          type: 'message',
          body: { text },
          fallback_text: text,
          to: text.includes('@deploy') ? ['agt_deploy'] : [],
        })
      }

      document.getElementById('send').onclick = send
      $input.onkeydown = (e) => e.key === 'Enter' && send()
    </script>
  </body>
</html>
